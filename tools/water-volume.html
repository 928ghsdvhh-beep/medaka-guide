<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="水槽の内寸からおおよその水量を計算。底砂や水位の影響も説明します。"><title>メダカ水槽の水量計算ツール｜メダカ飼育の道具ノート</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:auto;padding:24px;line-height:1.8;color:#24353b}a{color:#176f79}label{display:block;margin:14px 0}input{width:110px;padding:9px;font-size:17px}button{padding:12px 22px;background:#176f79;color:white;border:0;border-radius:7px;font-size:16px}output{font-size:26px;font-weight:bold}aside{background:#edf5f5;padding:15px;border-radius:8px}</style></head><body><a href="../index.html">トップページ</a><h1>メダカ水槽の水量計算ツール</h1><p>水槽の<strong>内寸</strong>をセンチメートルで入力すると、おおよその水量を計算できます。</p><form id="calc"><label>横幅（cm） <input id="w" type="number" min="1" max="1000" step="0.1" required></label><label>奥行き（cm） <input id="d" type="number" min="1" max="1000" step="0.1" required></label><label>実際の水深（cm） <input id="h" type="number" min="1" max="1000" step="0.1" required></label><button type="submit">水量を計算</button></form><p aria-live="polite"><output id="result">数値を入力してください</output></p><aside><strong>注意：</strong>直方体の水槽を想定した概算です。底砂、流木、器具などの体積を差し引いていないため、実際の水量は少なくなります。水量だけで飼育可能な匹数は決まりません。</aside><h2>計算式</h2><p>横幅 × 奥行き × 水深 ÷ 1,000 ＝ 水量（L）</p><p><a href="medaka-tank-size.html">水槽の大きさの選び方も読む</a></p><p>Amazonのアソシエイトとして、当サイトは適格販売により収入を得ています。本ページには商品リンクはありません。</p><script>document.getElementById('calc').addEventListener('submit',function(e){e.preventDefault();const a=['w','d','h'].map(id=>Number(document.getElementById(id).value));document.getElementById('result').textContent=a.every(n=>Number.isFinite(n)&&n>0&&n<=1000)?'概算 '+(a[0]*a[1]*a[2]/1000).toLocaleString('ja-JP',{maximumFractionDigits:2})+' L':'正しい数値を入力してください';});</script></body></html>

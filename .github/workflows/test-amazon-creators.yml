name: Test Amazon Creators API authentication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Creators API access without exposing credentials
        env:
          CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          client_id = os.environ.get("CLIENT_ID", "")
          client_secret = os.environ.get("CLIENT_SECRET", "")
          if not client_id or not client_secret:
              raise SystemExit("Missing GitHub repository secrets.")
          body = json.dumps({"grant_type":"client_credentials","client_id":client_id,"client_secret":client_secret,"scope":"creatorsapi::default"}).encode()
          req = urllib.request.Request("https://api.amazon.co.jp/auth/o2/token", data=body, headers={"Content-Type":"application/json"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  data = json.load(response)
              if not data.get("access_token"):
                  raise SystemExit("Authentication response did not contain an access token.")
              print("Amazon Creators API OAuth authentication: SUCCESS")
          except urllib.error.HTTPError as exc:
              print("Amazon Creators API OAuth authentication: FAILED (HTTP %s)" % exc.code)
              raise SystemExit(1)
          except Exception:
              print("Amazon Creators API OAuth authentication: FAILED (connection or response error)")
              raise SystemExit(1)
          PY
